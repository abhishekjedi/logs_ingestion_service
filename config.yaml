app:
  base_url: http://localhost:8080
  port: "8080"

mysql:
  host: localhost
  port: "3306"
  user: root
  password: ""
  dbname: error_logging

redis:
  host: localhost
  port: "6379"
  password: ""
  db: 0

clickhouse:
  host: localhost
  port: "9000"
  user: default
  password: ""
  dbname: error_logging

kafka:
  brokers:
    - localhost:9092
  group_id: error-logging-worker
  topic: error-logs

worker:
  pool_size: 16
  fetch_max_messages: 500
  fetch_max_bytes: 33554432   # 32 MiB — bounds cycle memory by size, not just count
  fetch_max_wait: 200ms
  flush_chunk_rows: 50000     # cap rows per ClickHouse insert
  flush_retries: 3

sync:
  interval: 10s
  active_window: 2h
  batch_size: 500

s3:
  endpoint: localhost:9002
  access_key: minioadmin
  secret_key: minioadmin
  bucket: error-logging-raw
  region: us-east-1
  use_ssl: false
