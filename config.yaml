app:
  base_url: http://localhost:8080
  port: "8080"
  frontend_url: http://localhost:5173

auth:
  jwt_secret: dev-insecure-secret-change-me
  token_ttl: 24h
  cookie_name: errlog_session
  cookie_secure: false
  # Google OAuth — configure these in the gitignored config.local.yaml:
  #   google_client_id: <your-id>.apps.googleusercontent.com
  #   google_client_secret: <your-secret>
  #   google_redirect_url: http://localhost:8080/api/auth/google/callback

replay:
  request_timeout: 5s
  cache_ttl: 1m
  allow_insecure: false
  # Configure in config.local.yaml or ERRLOG_REPLAY_ENCRYPTION_KEY:
  # encryption_key: <at-least-32-random-characters>

mysql:
  host: localhost
  port: "3306"
  user: root
  password: ""
  dbname: error_logging

redis:
  host: localhost
  port: "6379"
  password: ""
  db: 0

clickhouse:
  host: localhost
  port: "9000"
  user: default
  password: ""
  dbname: error_logging

kafka:
  brokers:
    - localhost:9092
  group_id: error-logging-worker
  topic: error-logs

worker:
  pool_size: 16
  fetch_max_messages: 500
  fetch_max_bytes: 33554432   # 32 MiB — bounds cycle memory by size, not just count
  fetch_max_wait: 200ms
  flush_chunk_rows: 50000     # cap rows per ClickHouse insert
  flush_retries: 3

sync:
  interval: 10s
  active_window: 2h
  batch_size: 500

s3:
  endpoint: localhost:9002
  access_key: minioadmin
  secret_key: minioadmin
  bucket: error-logging-raw
  region: us-east-1
  use_ssl: false
