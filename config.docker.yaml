# Config for running the app *inside* docker-compose, where dependencies are
# reached by service name (not localhost). Mount this over /app/config.yaml.
app:
  base_url: http://localhost:8080
  port: "8080"

worker:
  pool_size: 16
  fetch_max_messages: 500
  fetch_max_bytes: 33554432
  fetch_max_wait: 200ms
  flush_chunk_rows: 50000
  flush_retries: 3

mysql:
  host: mysql
  port: "3306"
  user: root
  password: ""
  dbname: error_logging

redis:
  host: redis
  port: "6379"
  password: ""
  db: 0

clickhouse:
  host: clickhouse
  port: "9000"
  user: default
  password: ""
  dbname: error_logging

kafka:
  brokers:
    - kafka:29092
  group_id: error-logging-worker
  topic: error-logs

s3:
  endpoint: minio:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: error-logging-raw
  region: us-east-1
  use_ssl: false
